# ETH War — ethwar.ondream.ai (HTTPS stage: certificate issued by certbot --webroot)
# Installed by deploy/server/install.sh as /etc/nginx/conf.d/zz-ethwar.ondream.ai.conf.
# The "zz-" prefix keeps this file last so it never becomes the implicit default server.
server {
    listen 80;
    server_name ethwar.ondream.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ethwar-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://ethwar.ondream.ai$request_uri;
    }
}

server {
    # @HTTPS_LISTEN@ (deploy/render-nginx.sh puts private/deploy/https-listen.conf here)
    server_name ethwar.ondream.ai;
    ssl_certificate /etc/letsencrypt/live/ethwar.ondream.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ethwar.ondream.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ethwar.ondream.ai/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite output: content-hashed, safe to cache forever.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
